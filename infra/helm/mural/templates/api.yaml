apiVersion: v1
kind: Service
metadata:
  name: {{ include "mural.fullname" . }}-api
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "mural.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mural.fullname" . }}-api
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Sem replicas fixo quando o HPA está ativo: senão cada helm upgrade
  # reverte o número de réplicas que o HPA ajustou por conta própria.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount.api }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mural.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "mural.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mural.fullname" . }}-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mural.fullname" . }}-db-credentials
                  key: DATABASE_URL
          # liveness != readiness (fricção proposital do desafio):
          #   /healthz nunca toca no banco -> liveness.
          #   /readyz  só passa com schema pronto -> readiness.
          # Invertê-las derruba o pod em CrashLoop antes da migration rodar.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
