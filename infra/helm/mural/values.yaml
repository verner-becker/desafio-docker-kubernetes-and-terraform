image:
  api:
    repository: mural-api
    tag: local
    pullPolicy: IfNotPresent
  web:
    repository: mural-web
    tag: local
    pullPolicy: IfNotPresent

replicaCount:
  api: 1
  web: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

api:
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

web:
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

migration:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgres:
  image: postgres:16-alpine
  user: mural
  database: mural
  # Senha nunca fica com valor literal aqui — este chart espera que quem
  # instala injete via --set/--set-string postgres.password=... (o Terraform
  # maestro faz isso com um random_password, via set_sensitive).
  password: ""
  storage: 1Gi
  storageClassName: standard
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  className: traefik
  host: mural.localtest.me
